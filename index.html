<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Toupie contre Cafards</title>
<style>
  :root {
    --panel: rgba(20, 16, 12, 0.88);
    --panel-2: rgba(255, 255, 255, 0.06);
    --text: #f5efe6;
    --muted: #b9ab98;
    --gold: #ffc94a;
    --green: #5fd38a;
    --red: #ff6b5b;
    --accent: #ff9f43;
    --pink: #ff8ad8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1410; color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; }

  #hud { position: fixed; top: 10px; left: 10px; padding: 10px 14px; background: var(--panel); border-radius: 12px;
    pointer-events: none; width: 210px; }
  #money { font-size: 26px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  #hud .sub { color: var(--muted); font-size: 12px; }
  .hudRow { margin-top: 6px; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
  .hudRow b { font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  #snackBar { background: #d9a05b; }
  #waveBar { background: #7fb2ff; transition: none; }
  #hud.hurt { animation: hurt .45s; }
  @keyframes hurt { 0%, 100% { background: var(--panel); } 30% { background: rgba(180, 30, 20, .9); } }
  #perksLine { margin-top: 6px; font-size: 15px; letter-spacing: 1px; min-height: 0; }

  #status { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: var(--panel);
    border-radius: 999px; pointer-events: none; font-size: 14px; white-space: nowrap; max-width: calc(100vw - 32px);
    overflow: hidden; text-overflow: ellipsis; }

  #gauge { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); width: 26px; height: 46vh; max-height: 300px;
    background: var(--panel); border-radius: 13px; padding: 4px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  #gauge.on { opacity: 1; }
  #gaugeInner { position: relative; width: 100%; height: 100%; border-radius: 9px; overflow: hidden; background: rgba(255,255,255,0.08); }
  #gaugePerfect { position: absolute; left: 0; right: 0; top: 0; background: rgba(95, 211, 138, 0.45); }
  #gaugeFill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, #ff9f43, #ffe08a); }

  #shopBtn { position: fixed; top: 10px; right: 10px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--accent);
    color: #1a1410; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #shopBtn .dot { display: none; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: middle; }
  #shopBtn.can .dot { display: inline-block; }

  #shop { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--panel); backdrop-filter: blur(6px);
    display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s ease; z-index: 5; }
  #shop.open { transform: none; }
  .shopHead { display: flex; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex: 1; }
  .tabs button, #closeShop { border: 0; border-radius: 8px; padding: 8px 4px; background: var(--panel-2); color: var(--text);
    font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .tabs button.active { background: var(--accent); color: #1a1410; }
  #shopList { overflow-y: auto; padding: 10px; flex: 1; }
  .card { background: var(--panel-2); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: grid;
    grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
  .card .name { font-weight: 800; }
  .card .lvl { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 4px; }
  .card .desc { grid-column: 1; color: var(--muted); font-size: 12px; }
  .card .val { grid-column: 1; font-size: 13px; font-variant-numeric: tabular-nums; }
  .card .val b { color: var(--green); }
  .card .skin { grid-column: 1; font-size: 12px; color: var(--pink); }
  .card button { grid-row: 1 / span 4; grid-column: 2; border: 0; border-radius: 9px; padding: 10px 12px; min-width: 86px;
    font-weight: 800; font-size: 14px; cursor: pointer; background: var(--gold); color: #1a1410; font-variant-numeric: tabular-nums; }
  .card button:disabled { background: rgba(255,255,255,.12); color: var(--muted); cursor: default; }
  .card.locked { opacity: .55; }
  .statRow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .statRow span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .statTitle { margin: 14px 0 4px; color: var(--accent); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  #resetBtn { margin-top: 18px; width: 100%; border: 1px solid var(--red); background: transparent; color: var(--red); border-radius: 9px;
    padding: 10px; font-weight: 700; cursor: pointer; }

  #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 16px; color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,.8); white-space: nowrap; animation: rise 1s ease-out forwards; }
  .pop.big { font-size: 26px; color: var(--green); }
  .pop.crit { color: var(--red); font-size: 18px; }
  .pop.bite { color: #ffb36b; font-size: 20px; }
  @keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -50px; } }

  #banner { position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(.9); padding: 14px 22px; background: var(--panel);
    border: 2px solid var(--accent); border-radius: 14px; font-weight: 800; font-size: 18px; text-align: center; opacity: 0;
    transition: opacity .3s, transform .3s; pointer-events: none; max-width: calc(100vw - 32px); }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; margin-top: 4px; }

  /* Fenêtres : choix de bonus et défaite */
  #modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 6, 3, 0.72); backdrop-filter: blur(3px); }
  #modal.open { display: flex; }
  .modalBox { background: #241b14; border: 2px solid var(--accent); border-radius: 16px; padding: 18px; width: min(560px, 100%);
    max-height: calc(100vh - 32px); overflow-y: auto; text-align: center; }
  .modalBox h2 { margin: 0 0 4px; font-size: 22px; }
  .modalBox .lead { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
  .perkChoices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .perk { border: 2px solid rgba(255,255,255,.12); background: var(--panel-2); border-radius: 12px; padding: 14px 10px; color: var(--text);
    cursor: pointer; font: inherit; text-align: center; transition: transform .1s, border-color .1s; }
  .perk:hover, .perk:focus-visible { border-color: var(--gold); transform: translateY(-2px); outline: none; }
  .perk .ico { font-size: 34px; line-height: 1.1; }
  .perk .pname { font-weight: 800; margin: 6px 0 4px; }
  .perk .pdesc { color: var(--muted); font-size: 13px; }
  .perk .pstack { color: var(--pink); font-size: 12px; margin-top: 6px; }
  .summary { text-align: left; margin: 10px 0 16px; }
  .bigBtn { border: 0; border-radius: 12px; padding: 12px 22px; background: var(--gold); color: #1a1410; font-weight: 800; font-size: 16px; cursor: pointer; }
  .defeat { border-color: var(--red); }
  .defeat h2 { color: var(--red); }

  @media (min-width: 1000px) {
    #shop { transform: none; }
    #shopBtn, #closeShop { display: none; }
    #game { right: 380px; }
    #status { left: calc(50% - 190px); }
    #gauge { right: 398px; }
    #modal { right: 380px; }
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="money">0 $</div>
  <div class="sub" id="killsLine"></div>
  <div class="hudRow"><span>🍪 Goûter</span><b id="snackText"></b></div>
  <div class="bar"><div id="snackBar"></div></div>
  <div class="hudRow"><span id="waveText"></span><b id="waveTimer"></b></div>
  <div class="bar"><div id="waveBar"></div></div>
  <div class="hudRow"><span id="infestName"></span></div>
  <div class="bar"><div id="infestBar"></div></div>
  <div id="perksLine"></div>
</div>

<div id="status"></div>
<div id="gauge"><div id="gaugeInner"><div id="gaugePerfect"></div><div id="gaugeFill"></div></div></div>
<button id="shopBtn">🛠 Atelier<span class="dot"></span></button>

<aside id="shop">
  <div class="shopHead">
    <div class="tabs" id="tabs"></div>
    <button id="closeShop" aria-label="Fermer">✕</button>
  </div>
  <div id="shopList"></div>
</aside>

<div id="popups"></div>
<div id="banner"></div>
<div id="modal"><div class="modalBox" id="modalBox"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// =====================================================================
//  RÉGLAGES DU MONDE
// =====================================================================
const DESK_X = 0.78;          // demi-largeur du bureau (m)
const DESK_Z = 0.48;          // demi-profondeur du bureau (m)
const LAUNCH = new THREE.Vector2(0, 0.40); // point de lancement (côté joueur)
const PLATE = { x: -0.44, z: 0.31, r: 0.075 }; // l'assiette du goûter, à défendre
const OBSTACLES = [            // objets posés sur le bureau (la toupie rebondit dessus)
  { x: 0.60, z: -0.30, r: 0.045, h: 0.10, color: 0xd9534f, kind: 'mug' },
  { x: -0.62, z: -0.28, r: 0.04, h: 0.11, color: 0x3b6ea5, kind: 'pot' },
  { x: PLATE.x, z: PLATE.z, r: PLATE.r, h: 0.012, color: 0xf2efe8, kind: 'plate' },
];
const SAVE_KEY = 'toupie-cafards-save-v1';
const BUG_VISUAL = 1.35;       // les insectes sont dessinés un peu plus gros que leur zone de contact
const WAVE_LEN = 40;           // durée d'une vague (s)
const SNACK_MAX = 20;          // bouchées du goûter au début d'une partie
const COMBO_CAP = 4;           // le bonus de combo ne dépasse jamais ×4

// =====================================================================
//  INSECTES
// =====================================================================
const BUG_TYPES = [
  { id: 'petit',    name: 'Petit cafard',        r: 0.016, hp: 1,    speed: 0.07, reward: 1,    mass: 1,   bite: 1, color: 0x7a4a24, fear: 0 },
  { id: 'cafard',   name: 'Cafard',              r: 0.024, hp: 2.5,  speed: 0.13, reward: 5,    mass: 3,   bite: 1, color: 0x5a3216, fear: 0.12 },
  { id: 'gros',     name: 'Gros cafard',         r: 0.034, hp: 15,   speed: 0.11, reward: 22,   mass: 8,   bite: 2, color: 0x3d200c, fear: 0.14 },
  { id: 'blinde',   name: 'Cafard blindé',       r: 0.042, hp: 60,   speed: 0.09, reward: 100,  mass: 20,  bite: 2, color: 0x34343c, fear: 0.10, metal: 0.7 },
  { id: 'scarabee', name: 'Scarabée rhinocéros', r: 0.055, hp: 260,  speed: 0.07, reward: 450,  mass: 50,  bite: 3, color: 0x22401f, fear: 0.0,  metal: 0.4, horn: true },
  { id: 'reine',    name: 'Reine des cafards',   r: 0.085, hp: 1600, speed: 0.05, reward: 3500, mass: 150, bite: 4, color: 0x5a1838, fear: 0.0,  metal: 0.2, crown: true, rare: true },
];
// Nombre total de cafards écrasés pour débloquer chaque niveau d'infestation
const INFEST_THRESHOLDS = [0, 25, 120, 500, 2000, 8000];

// =====================================================================
//  AMÉLIORATIONS PERMANENTES (atelier) — avec leurs skins
// =====================================================================
const TABS = [
  { id: 'toupie', label: '🌀 Toupie' },
  { id: 'lanceur', label: '🚀 Lanceur' },
  { id: 'bureau', label: '🪳 Bureau' },
  { id: 'stats', label: '📊 Stats' },
];

const UPGRADES = [
  // --- Toupie ---
  { id: 'endurance', tab: 'toupie', name: 'Endurance', desc: 'Perd sa rotation moins vite : tourne plus longtemps.', base: 15, growth: 1.35, max: 40,
    skins: [[0, 'Poignée bâton'], [5, 'Poignée boule'], [12, 'Gemme violette'], [22, 'Flamme éternelle']],
    fmt: s => `${estimatedSpin(s).toFixed(1)} s de rotation` },
  { id: 'diametre', tab: 'toupie', name: 'Diamètre', desc: 'Une toupie plus large touche plus de cafards.', base: 17, growth: 1.4, max: 30,
    skins: [[0, 'Bord lisse'], [5, 'Anneau chromé'], [12, 'Double anneau'], [20, 'Couronne crénelée']],
    fmt: s => `${(s.radius * 200).toFixed(1)} cm` },
  { id: 'poids', tab: 'toupie', name: 'Poids', desc: 'Frappe plus fort et se fait moins repousser.', base: 19, growth: 1.4, max: 35,
    skins: [[0, 'Plastique'], [3, 'Bois'], [8, 'Acier'], [15, 'Or massif'], [25, 'Obsidienne']],
    fmt: s => `${Math.round(s.mass)} g` },
  { id: 'pointe', tab: 'toupie', name: 'Pointe', desc: 'Pointe plus fine : glisse plus loin et se promène plus vite.', base: 20, growth: 1.4, max: 25,
    skins: [[0, 'Pointe plastique'], [4, 'Pointe acier'], [10, 'Pointe rubis'], [18, 'Pointe diamant']],
    fmt: s => `balade ${(s.drift / s.linFric * 100).toFixed(0)} cm/s` },
  { id: 'lames', tab: 'toupie', name: 'Lames', desc: 'Ajoute des lames : plus de dégâts par contact.', base: 20, growth: 1.4, max: 40,
    skins: [[0, 'Aucune lame'], [1, '2 lames'], [4, '4 lames'], [10, '6 faux'], [20, '8 dents de scie'], [30, 'Lames de lave']],
    fmt: s => `×${s.blades.toFixed(2)} dégâts` },
  { id: 'inertie', tab: 'toupie', name: 'Inertie', desc: 'Perd moins de rotation en percutant les insectes.', base: 35, growth: 1.45, max: 30,
    skins: [[0, 'Sans volant'], [4, 'Volant d’inertie'], [10, 'Disque lourd'], [20, 'Double volant']],
    fmt: s => `−${Math.round((1 - s.inertia) * 100)} % de perte au choc` },
  { id: 'equilibre', tab: 'toupie', name: 'Équilibre', desc: 'Reste debout même en tournant lentement.', base: 50, growth: 1.45, max: 25,
    skins: [[0, 'Sans gyroscope'], [5, 'Gyroscope'], [12, 'Double gyroscope']],
    fmt: s => `tombe sous ${Math.round(s.fallRatio * 100)} %` },
  { id: 'rebond', tab: 'toupie', name: 'Rebond', desc: 'Garde sa vitesse en rebondissant sur les bords.', base: 25, growth: 1.45, max: 12,
    skins: [[0, 'Sans pare-chocs'], [3, 'Pare-chocs caoutchouc'], [8, 'Pare-chocs fluo']],
    fmt: s => `${Math.round(s.restitution * 100)} % conservé` },
  { id: 'agressivite', tab: 'toupie', name: 'Agressivité', desc: 'La toupie se dirige vers les insectes proches.', base: 150, growth: 1.5, max: 15,
    unlock: () => infestLevel() >= 1, lockText: 'Niveau d’infestation 2',
    skins: [[0, 'Gentille'], [1, 'Petites dents'], [5, 'Épines'], [10, 'Épines + yeux rouges']],
    fmt: s => `attraction ${s.chase.toFixed(2)}` },
  { id: 'critique', tab: 'toupie', name: 'Coup critique', desc: 'Chance d’infliger un coup ×3.', base: 90, growth: 1.45, max: 15,
    unlock: () => infestLevel() >= 1, lockText: 'Niveau d’infestation 2',
    skins: [[0, 'Sans aura'], [3, 'Étincelles'], [8, 'Aura rouge'], [13, 'Aura de foudre']],
    fmt: s => `${Math.round(s.crit * 100)} % de chance` },

  // --- Lanceur ---
  { id: 'puissance', tab: 'lanceur', name: 'Puissance', desc: 'La toupie démarre en tournant plus vite.', base: 17, growth: 1.38, max: 40,
    skins: [[0, 'Lanceur plastique'], [5, 'Lanceur métal'], [12, 'Lanceur fusée'], [22, 'Lanceur doré']],
    fmt: s => `${fmtInt(s.rpm)} tr/min` },
  { id: 'elan', tab: 'lanceur', name: 'Élan', desc: 'La toupie part plus vite et plus loin.', base: 15, growth: 1.35, max: 30,
    skins: [[0, 'Sans traînée'], [5, 'Traînée blanche'], [12, 'Traînée bleue'], [20, 'Traînée de feu']],
    fmt: s => `${(s.speed * 100).toFixed(0)} cm/s` },
  { id: 'precision', tab: 'lanceur', name: 'Précision', desc: 'Zone « PARFAIT » plus large (+25 % de puissance).', base: 17, growth: 1.5, max: 12,
    fmt: s => `zone de ${Math.round(s.perfect * 100)} %` },
  { id: 'recharge', tab: 'lanceur', name: 'Recharge', desc: 'Moins d’attente entre deux lancers.', base: 19, growth: 1.4, max: 20,
    fmt: s => `${s.cooldown.toFixed(2)} s d’attente` },
  { id: 'multi', tab: 'lanceur', name: 'Multi-lancer', desc: 'Lance plusieurs toupies d’un coup.', base: 1500, growth: 7, max: 3,
    unlock: () => infestLevel() >= 2, lockText: 'Niveau d’infestation 3',
    fmt: s => `${s.tops} toupie${s.tops > 1 ? 's' : ''} par lancer` },
  { id: 'auto', tab: 'lanceur', name: 'Lanceur automatique', desc: 'Relance tout seul dès que la toupie est prête.', base: 3000, growth: 1, max: 1,
    unlock: () => infestLevel() >= 2, lockText: 'Niveau d’infestation 3',
    fmt: s => s.auto ? 'activé' : 'désactivé' },

  // --- Bureau / économie ---
  { id: 'appat', tab: 'bureau', name: 'Appât', desc: 'Les insectes arrivent plus souvent.', base: 17, growth: 1.38, max: 30,
    fmt: s => `${s.spawnRate.toFixed(2)} insecte/s` },
  { id: 'nid', tab: 'bureau', name: 'Nid', desc: 'Plus d’insectes en même temps sur le bureau.', base: 22, growth: 1.4, max: 25,
    fmt: s => `${s.maxBugs} insectes max` },
  { id: 'prime', tab: 'bureau', name: 'Prime', desc: 'Chaque insecte écrasé rapporte plus.', base: 30, growth: 1.45, max: 40,
    fmt: s => `×${s.bounty.toFixed(1)} argent` },
  { id: 'combo', tab: 'bureau', name: 'Combo', desc: 'Bonus quand on écrase plusieurs insectes à la suite.', base: 50, growth: 1.5, max: 20,
    fmt: s => `+${Math.round(s.comboBonus * 100)} % / insecte, ${s.comboWindow.toFixed(1)} s` },
];

// =====================================================================
//  BONUS DE PARTIE (choix entre 3 à la fin de chaque vague, perdus en cas de défaite)
// =====================================================================
const PERKS = [
  { id: 'odeur', icon: '🍬', name: 'Odeur sucrée', max: 3,
    desc: n => `La toupie sent bon : certains insectes proches (${Math.round(smellChance(n) * 100)} %) s’approchent d’elle, dans un rayon de ${Math.round(smellRadius(n) * 100)} cm.` },
  { id: 'aiguise', icon: '🔪', name: 'Lames aiguisées', max: 5, desc: () => '+30 % de dégâts.' },
  { id: 'roulement', icon: '⚙️', name: 'Roulement à billes', max: 4, desc: () => 'La toupie tourne 25 % plus longtemps.' },
  { id: 'cookies', icon: '🍪', name: 'Boîte de cookies', max: 5, desc: () => '+6 bouchées de goûter tout de suite, et +4 au maximum.' },
  { id: 'glu', icon: '🪤', name: 'Piège à glu', max: 3, desc: () => 'Pose un piège collant sur le bureau : les insectes y avancent 4 fois moins vite.' },
  { id: 'or', icon: '💰', name: 'Ruée vers l’or', max: 5, desc: () => '+25 % d’argent par insecte.' },
  { id: 'jumelle', icon: '👯', name: 'Toupie jumelle', max: 3, desc: () => '25 % de chance de lancer une toupie en plus.' },
  { id: 'onde', icon: '💥', name: 'Onde de choc', max: 3, desc: () => 'Quand la toupie tombe, elle explose et blesse les insectes autour.' },
  { id: 'spray', icon: '🧴', name: 'Spray anti-faim', max: 3, desc: () => 'Les affamés traînent 30 % plus longtemps avant de foncer sur le goûter.' },
  { id: 'ressort', icon: '🌀', name: 'Ressort turbo', max: 4, desc: () => '+20 % d’élan et +15 % de rotation au lancer.' },
  { id: 'braise', icon: '🔥', name: 'Combo brûlant', max: 3, desc: () => '+10 % de bonus par insecte dans un combo.' },
  { id: 'epines', icon: '🦔', name: 'Épines empoisonnées', max: 3, desc: () => '+10 % de chance de coup critique.' },
  { id: 'plomb', icon: '🪨', name: 'Lest en plomb', max: 4, desc: () => '+25 % de poids.' },
];
function smellRadius(n) { return 0.06 + 0.035 * n; }
function smellChance(n) { return Math.min(0.6, 0.2 + 0.13 * n); }

// Calcule toutes les stats à partir des niveaux (atelier) et des bonus de la partie
function computeStats(L, P = perkLevel) {
  const s = {
    radius: 0.036 * (1 + 0.08 * L('diametre')),
    mass: 20 * (1 + 0.15 * L('poids')) * Math.pow(1.25, P('plomb')),
    inertia: 1 / (1 + 0.12 * L('inertie')),
    decay: 0.17 / (1 + 0.15 * L('endurance')) * Math.pow(0.8, P('roulement')),
    linFric: 0.75 / (1 + 0.12 * L('pointe')),
    drift: 0.22 * (1 + 0.1 * L('pointe')),
    blades: (1 + 0.25 * L('lames')) * Math.pow(1.3, P('aiguise')),
    fallRatio: 0.25 / (1 + 0.1 * L('equilibre')),
    restitution: Math.min(0.95, 0.35 + 0.05 * L('rebond')),
    chase: 0.12 * L('agressivite'),
    crit: Math.min(0.6, 0.03 * L('critique') + 0.1 * P('epines')),
    rpm: 600 * (1 + 0.18 * L('puissance')) * Math.pow(1.15, P('ressort')),
    speed: 0.35 * (1 + 0.12 * L('elan')) * Math.pow(1.2, P('ressort')),
    perfect: 0.06 + 0.02 * L('precision'),
    cooldown: 2.5 / (1 + 0.2 * L('recharge')),
    tops: 1 + L('multi'),
    auto: L('auto') > 0,
    spawnRate: 0.9 * (1 + 0.15 * L('appat')),
    maxBugs: 12 + 2 * L('nid'),
    bounty: (1 + 0.2 * L('prime')) * (1 + 0.25 * P('or')) * recordBonus(),
    comboWindow: 1.2 + 0.2 * L('combo'),
    comboBonus: 0.1 + 0.02 * L('combo') + 0.1 * P('braise'),
    smellRadius: P('odeur') ? smellRadius(P('odeur')) : 0,
    smellChance: P('odeur') ? smellChance(P('odeur')) : 0,
    twinChance: 0.25 * P('jumelle'),
    shockRadius: P('onde') ? 0.07 + 0.03 * P('onde') : 0,
    hungerMult: Math.pow(1.3, P('spray')),
  };
  return s;
}
// Bonus permanent d'argent selon la meilleure vague atteinte (+2 % par vague, jusqu'à +100 %)
function recordBonus() { return 1 + Math.min(1, 0.02 * Math.max(0, (state.bestWave || 1) - 1)); }
// Durée de rotation estimée (sans chocs) pour un lancer à pleine puissance
function estimatedSpin(s) { return Math.log(1 / s.fallRatio) / s.decay; }

function newRun() {
  return { wave: 1, waveTime: 0, raidsSent: 0, snack: SNACK_MAX, maxSnack: SNACK_MAX, perks: {}, kills: 0, money: 0, traps: [], choice: null, over: false };
}
const state = {
  money: 0, totalMoney: 0, kills: 0, launches: 0, bestCombo: 0, levels: {}, killsByType: {},
  bestWave: 1, runs: 1, run: newRun(),
};
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (data && typeof data === 'object') {
      for (const k of Object.keys(state)) if (k in data) state[k] = data[k];
      state.run = Object.assign(newRun(), data.run || {});
    }
  } catch { /* pas de sauvegarde, ou stockage bloqué */ }
  if (!Number.isFinite(state.money)) state.money = 0;
}
let resetting = false; // pendant une remise à zéro, on n'enregistre plus rien
function save() {
  if (resetting) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* stockage indisponible */ }
}
load();

const lv = id => state.levels[id] || 0;
function perkLevel(id) { return state.run.perks[id] || 0; }
let S = computeStats(lv);
function refreshStats() { S = computeStats(lv); }
function costOf(u) { return Math.ceil(u.base * Math.pow(u.growth, lv(u.id))); }
function infestLevel() {
  let l = 0;
  for (let i = 0; i < INFEST_THRESHOLDS.length; i++) if (state.kills >= INFEST_THRESHOLDS[i]) l = i;
  return l;
}
// Palier de skin actuel d'une amélioration
function skinTier(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u?.skins) return 0;
  let t = 0;
  u.skins.forEach(([lvl], i) => { if (lv(id) >= lvl) t = i; });
  return t;
}

const camera = new THREE.PerspectiveCamera(52, 1, 0.01, 10);
function placeCamera() {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  const aspect = w / h;
  camera.aspect = aspect;
  // Sur écran étroit (téléphone en portrait), vue plus plongeante
  const k = Math.min(1, Math.max(0, (1.5 - aspect) / 1));
  const target = new THREE.Vector3(0, 0, 0.02);
  const dir = new THREE.Vector3(0, 0.95 + k * 0.6, 0.84 - k * 0.3).sub(target).normalize();
  // On recule la caméra jusqu'à ce que les 4 coins du bureau et le lanceur tiennent dans l'écran
  const corners = [[-DESK_X, -DESK_Z], [DESK_X, -DESK_Z], [-DESK_X, DESK_Z], [DESK_X, DESK_Z], [0, LAUNCH.y + 0.08]]
    .map(([x, z]) => new THREE.Vector3(x, 0, z));
  const v = new THREE.Vector3();
  for (let dist = 0.9; dist < 6; dist += 0.03) {
    camera.position.copy(target).addScaledVector(dir, dist);
    camera.lookAt(target);
    camera.updateMatrixWorld();
    camera.updateProjectionMatrix();
    if (corners.every(c => { v.copy(c).project(camera); return Math.abs(v.x) < 0.94 && v.y > -0.82 && v.y < 0.8; })) break;
  }
}

function woodCanvas(base, line) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 140; i++) {
    const y = Math.random() * 512;
    g.strokeStyle = line(Math.random());
    g.lineWidth = 1 + Math.random() * 3;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x * 0.02 + i) * 4 + (Math.random() - 0.5) * 2);
    g.stroke();
  }
  return c;
}

const texCache = new Map();
function stripeTexture(colors, key) {
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  for (let i = 0; i < 8; i++) {
    g.fillStyle = colors[i % colors.length];
    g.fillRect(i * 32, 0, 32, 64);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  texCache.set(key, t);
  return t;
}

    case 1: return new THREE.MeshStandardMaterial({ map: stripeTexture(['#8a5a2b', '#b07a44', '#6e4420', '#c18d55'], 'bois'), roughness: 0.8 });
    case 2: return new THREE.MeshStandardMaterial({ map: stripeTexture(['#c9d1d8', '#7d8790', '#e6ebef', '#5d666e'], 'acier'), metalness: 0.9, roughness: 0.3 });
    case 3: return new THREE.MeshStandardMaterial({ map: stripeTexture(['#ffd65a', '#c99a1c', '#fff0a8', '#a87a10'], 'or'), metalness: 1, roughness: 0.22 });
    default: return new THREE.MeshStandardMaterial({ map: stripeTexture(['#1a0f24', '#3b1d5c', '#120a1a', '#5b2a8c'], 'obs'), metalness: 0.6, roughness: 0.25, emissive: 0x2a0d4a, emissiveIntensity: 0.6 });
  }
}

function makeTopMesh() {
  const tilt = new THREE.Group();   // inclinaison (vacillement)
  const spinner = new THREE.Group(); // tout ce qui tourne
  tilt.add(spinner);
  const parts = { flame: null, aura: null };
  const add = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; spinner.add(m); return m; };

  // Corps (matière selon le Poids)
  add(bodyGeo, bodyMaterial());

  // Pointe (selon la Pointe)
  const tipT = skinTier('pointe');
  const tipLook = [
    { r: 0.3, mat: new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.5 }), seg: 12 },
    { r: 0.2, mat: new THREE.MeshStandardMaterial({ color: 0xc9d1d8, metalness: 0.95, roughness: 0.2 }), seg: 12 },
    { r: 0.22, mat: new THREE.MeshStandardMaterial({ color: 0xe0115f, emissive: 0x7a0020, emissiveIntensity: 0.6, roughness: 0.15 }), seg: 6 },
    { r: 0.2, mat: new THREE.MeshStandardMaterial({ color: 0xbff4ff, emissive: 0x3fb8d8, emissiveIntensity: 0.8, roughness: 0.05, transparent: true, opacity: 0.85 }), seg: 5 },
  ][tipT];
  const tip = add(new THREE.ConeGeometry(tipLook.r, 0.17, tipLook.seg), tipLook.mat, 0, 0.085, 0);
  tip.rotation.x = Math.PI;

  // Poignée (selon l'Endurance)
  const knobT = skinTier('endurance');
  const stickMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.4 });
  add(new THREE.CylinderGeometry(0.1, 0.12, 0.3, 10), stickMat, 0, 0.8, 0);
  if (knobT === 1) add(new THREE.SphereGeometry(0.17, 14, 10), new THREE.MeshStandardMaterial({ color: 0xff9f43, roughness: 0.3 }), 0, 1.0, 0);
  if (knobT === 2) add(new THREE.OctahedronGeometry(0.22), new THREE.MeshStandardMaterial({ color: 0xa25cff, emissive: 0x5a1fb0, emissiveIntensity: 0.9, roughness: 0.1 }), 0, 1.05, 0);
  if (knobT === 3) parts.flame = add(new THREE.ConeGeometry(0.16, 0.45, 10), new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.85 }), 0, 1.15, 0);

  // Anneaux sur le bord (selon le Diamètre)
  const ringT = skinTier('diametre');
  const chrome = new THREE.MeshStandardMaterial({ color: 0xdfe6ec, metalness: 1, roughness: 0.2 });
  if (ringT >= 1) { const r = add(new THREE.TorusGeometry(1.0, 0.05, 8, 40), chrome, 0, 0.45, 0); r.rotation.x = Math.PI / 2; }
  if (ringT >= 2) { const r = add(new THREE.TorusGeometry(0.75, 0.045, 8, 40), chrome, 0, 0.58, 0); r.rotation.x = Math.PI / 2; }
  if (ringT >= 3) {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      add(new THREE.BoxGeometry(0.12, 0.14, 0.12), chrome, Math.cos(a) * 1.02, 0.55, Math.sin(a) * 1.02);
    }
  }

  // Lames (selon les Lames)
  const bladeT = skinTier('lames');
  const bladeCount = [0, 2, 4, 6, 8, 8][bladeT];
  const bladeMat = bladeT >= 5
    ? new THREE.MeshStandardMaterial({ color: 0xff5a1f, emissive: 0xff3a00, emissiveIntensity: 1.2, roughness: 0.3 })
    : new THREE.MeshStandardMaterial({ color: 0xcfd6dd, metalness: 0.9, roughness: 0.25 });
  for (let i = 0; i < bladeCount; i++) {
    const a = (i / bladeCount) * Math.PI * 2;
    let b;
    if (bladeT >= 4) {
      b = add(new THREE.ConeGeometry(0.1, 0.35, 4), bladeMat, Math.cos(a) * 1.12, 0.45, Math.sin(a) * 1.12);
      b.rotation.set(0, -a, -Math.PI / 2);
    } else if (bladeT === 3) {
      b = add(new THREE.BoxGeometry(0.5, 0.05, 0.08), bladeMat, Math.cos(a + 0.35) * 1.05, 0.45, Math.sin(a + 0.35) * 1.05);
      b.rotation.y = -a + 0.9; // forme de faux, inclinée
    } else {
      b = add(new THREE.BoxGeometry(0.45, 0.05, 0.08), bladeMat, Math.cos(a) * 1.05, 0.45, Math.sin(a) * 1.05);
      b.rotation.y = -a;
    }
  }

  // Volant d'inertie (selon l'Inertie)
  const flyT = skinTier('inertie');
  if (flyT >= 1) {
    const fm = new THREE.MeshStandardMaterial({ color: flyT >= 2 ? 0x3d4148 : 0x8c949c, metalness: 0.9, roughness: 0.35 });
    add(new THREE.CylinderGeometry(0.7, 0.7, flyT >= 2 ? 0.08 : 0.04, 32), fm, 0, 0.3, 0);
    if (flyT >= 3) add(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 32), fm, 0, 0.2, 0);
  }

  // Gyroscope (selon l'Équilibre) : anneaux qui ne tournent pas avec le corps
  const gyroT = skinTier('equilibre');
  const gyro = new THREE.Group();
  if (gyroT >= 1) {
    const gm = new THREE.MeshStandardMaterial({ color: 0x5fd3c8, metalness: 0.7, roughness: 0.3 });
    const g1 = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.03, 8, 32), gm);
    g1.position.y = 0.8;
    gyro.add(g1);
    if (gyroT >= 2) { const g2 = g1.clone(); g2.rotation.x = Math.PI / 2; gyro.add(g2); }
  }
  tilt.add(gyro);

  // Pare-chocs (selon le Rebond)
  const bumpT = skinTier('rebond');
  if (bumpT >= 1) {
    const r = add(new THREE.TorusGeometry(1.06, 0.07, 8, 40), new THREE.MeshStandardMaterial({ color: bumpT >= 2 ? 0x39ff6a : 0x1d1d1d, roughness: 0.9, emissive: bumpT >= 2 ? 0x0f5a20 : 0 }), 0, 0.42, 0);
    r.rotation.x = Math.PI / 2;
  }

  // Dents, épines et yeux (selon l'Agressivité)
  const aggT = skinTier('agressivite');
  if (aggT >= 1) {
    const sm = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.5, roughness: 0.4 });
    const n = aggT >= 2 ? 10 : 6, len = aggT >= 2 ? 0.28 : 0.15;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + 0.3;
      const sp = add(new THREE.ConeGeometry(0.05, len, 6), sm, Math.cos(a) * 0.95, 0.56, Math.sin(a) * 0.95);
      sp.rotation.set(0, -a, -Math.PI / 2 + 0.4);
    }
  }
  if (aggT >= 3) {
    const em = new THREE.MeshBasicMaterial({ color: 0xff1a1a });
    add(new THREE.SphereGeometry(0.07, 8, 6), em, 0.25, 0.64, 0.12);
    add(new THREE.SphereGeometry(0.07, 8, 6), em, 0.25, 0.64, -0.12);
  }

  // Aura (selon le Coup critique)
  const critT = skinTier('critique');
  if (critT >= 1) {
    const col = [0, 0xffe066, 0xff3b3b, 0x8fd3ff][critT];
    parts.aura = new THREE.Mesh(new THREE.TorusGeometry(1.25, critT >= 2 ? 0.08 : 0.03, 6, 40), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55 }));
    parts.aura.rotation.x = Math.PI / 2;
    parts.aura.position.y = 0.45;
    tilt.add(parts.aura);
  }

  scene.add(tilt);

  // Traînée (selon l'Élan)
  const trailT = skinTier('elan');
  let trail = null;
  if (trailT >= 1) {
    const n = 24;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    trail = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: [0, 0xffffff, 0x5ab8ff, 0xff6a1a][trailT], transparent: true, opacity: 0.55 }));
    trail.frustumCulled = false;
    scene.add(trail);
  }
  return { tilt, spinner, gyro, trail, trailInit: false, ...parts };
}

// Odeur sucrée : un cercle rose autour de la toupie
const smellGeo = new THREE.RingGeometry(0.97, 1, 48);
smellGeo.rotateX(-Math.PI / 2);

const tops = [];
function launchTops(aim, power, perfect) {
  const dir = new THREE.Vector2(aim.x - LAUNCH.x, aim.y - LAUNCH.y);
  if (dir.y > -0.05) dir.set(dir.x, -0.05);
  dir.normalize();
  const mult = perfect ? 1.25 : 1;
  const n = S.tops + (Math.random() < S.twinChance ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const ang = (i - (n - 1) / 2) * 0.28;
    const d = dir.clone().rotateAround(new THREE.Vector2(), ang);
    const spin = S.rpm * (0.4 + 0.6 * power) * mult;
    const speed = S.speed * (0.4 + 0.6 * power) * mult;
    const mesh = makeTopMesh();
    let smell = null;
    if (S.smellRadius > 0) {
      smell = new THREE.Mesh(smellGeo, new THREE.MeshBasicMaterial({ color: 0xff8ad8, transparent: true, opacity: 0.35, depthWrite: false }));
      scene.add(smell);
    }
    tops.push({
      x: LAUNCH.x + d.x * 0.02 * i, z: LAUNCH.y, vx: d.x * speed, vz: d.y * speed,
      spin, launchSpin: spin, wander: Math.atan2(d.y, d.x), wanderRate: 0, prec: 0, angle: 0,
      falling: 0, fallDir: 0, dead: false, smell, ...mesh,
    });
  }
  if (n > S.tops) popup('Toupie jumelle !', LAUNCH.x, LAUNCH.y - 0.12, 'big');
  state.launches++;
  launcherKick = 1;
}
function disposeTop(top) {
  for (const o of [top.tilt, top.trail, top.smell]) {
    if (!o) continue;
    scene.remove(o);
    o.traverse(m => { if (m.isMesh || m.isLine) { if (m.geometry !== bodyGeo && m.geometry !== smellGeo) m.geometry.dispose(); m.material.dispose(); } });
  }
}

const unitSphere = new THREE.SphereGeometry(1, 14, 10);
const legGeo = new THREE.BoxGeometry(0.06, 0.05, 0.75);
legGeo.translate(0, 0, 0.375);
const antGeo = new THREE.CylinderGeometry(0.015, 0.015, 1.3, 4);
antGeo.rotateZ(Math.PI / 2);
antGeo.translate(0.65, 0, 0);

function makeBugMesh(t) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.35, metalness: t.metal || 0.15 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a0f08, roughness: 0.6 });
  const body = new THREE.Mesh(unitSphere, mat);
  body.scale.set(1, 0.32, 0.62);
  body.position.y = 0.34;
  const thorax = new THREE.Mesh(unitSphere, mat);
  thorax.scale.set(0.38, 0.27, 0.56);
  thorax.position.set(0.72, 0.32, 0);
  const head = new THREE.Mesh(unitSphere, dark);
  head.scale.setScalar(0.24);
  head.position.set(1.05, 0.26, 0);
  g.add(body, thorax, head);
  for (const s of [-1, 1]) {
    const a = new THREE.Mesh(antGeo, dark);
    a.position.set(1.15, 0.3, s * 0.08);
    a.rotation.y = -s * 0.45;
    a.rotation.z = 0.25;
    g.add(a);
  }
  const legs = [];
  for (const x of [-0.35, 0.15, 0.6]) {
    for (const s of [-1, 1]) {
      const pivot = new THREE.Group();
      pivot.position.set(x, 0.28, s * 0.35);
      const leg = new THREE.Mesh(legGeo, dark);
      leg.rotation.x = s > 0 ? 0.55 : Math.PI - 0.55;
      pivot.add(leg);
      g.add(pivot);
      legs.push(pivot);
    }
  }
  if (t.horn) {
    const h = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.7, 8), mat);
    h.rotation.z = -1.1;
    h.position.set(1.3, 0.45, 0);
    g.add(h);
  }
  if (t.crown) {
    const c = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12), new THREE.MeshStandardMaterial({ color: 0xffcc33, metalness: 0.9, roughness: 0.2 }));
    c.rotation.x = Math.PI / 2;
    c.position.set(1.0, 0.55, 0);
    g.add(c);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.scale.setScalar(t.r * BUG_VISUAL);
  scene.add(g);
  return { group: g, legs, mat };
}

// Barre de vie au-dessus des gros insectes
const hpBgMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.6, depthTest: false });
const hpPlane = new THREE.PlaneGeometry(1, 1);
function makeHpBar() {
  const g = new THREE.Group();
  const bg = new THREE.Mesh(hpPlane, hpBgMat);
  const fill = new THREE.Mesh(hpPlane, new THREE.MeshBasicMaterial({ color: 0x5fd38a, depthTest: false }));
  fill.position.z = 0.001;
  bg.renderOrder = fill.renderOrder = 10;
  g.add(bg, fill);
  g.visible = false;
  scene.add(g);
  return { g, fill };
}

const bugs = [];
let spawnTimer = 0;

// Difficulté selon la vague
function waveSpawnMult() { return 1 + 0.08 * (state.run.wave - 1); }
// Nombre d'insectes affamés envoyés vers le goûter pendant la vague (les « raids »)
function waveRaiders() { return 1 + Math.floor(0.75 * (state.run.wave - 1)); }
function bugCap() { return S.maxBugs + infestLevel() * 2 + Math.floor((state.run.wave - 1) / 2); }

function pickBugType() {
  const lvl = infestLevel();
  const pool = [];
  for (let t = 0; t <= lvl; t++) {
    let w = (t < lvl ? 1 : 0.55) * Math.pow(1 + 0.12 * (state.run.wave - 1), t); // les vagues avancées amènent plus de gros insectes
    if (BUG_TYPES[t].rare) w *= 0.25;
    pool.push([t, w]);
  }
  let r = Math.random() * pool.reduce((a, [, w]) => a + w, 0);
  for (const [t, w] of pool) { if ((r -= w) <= 0) return BUG_TYPES[t]; }
  return BUG_TYPES[0];
}

function spawnBug(hungry = false) {
  const t = pickBugType();
  // Les insectes arrivent par un bord du bureau (sauf le bord côté joueur).
  // Les affamés partent du fond, pour laisser le temps de les intercepter.
  const side = hungry ? 0 : Math.floor(Math.random() * 3);
  let x, z;
  if (side === 0) { x = (Math.random() * 2 - 1) * DESK_X; z = -DESK_Z + 0.01; }
  else if (side === 1) { x = -DESK_X + 0.01; z = (Math.random() * 1.6 - 1) * DESK_Z; }
  else { x = DESK_X - 0.01; z = (Math.random() * 1.6 - 1) * DESK_Z; }
  const mesh = makeBugMesh(t);
  const hp = makeHpBar();
  const bug = {
    t, x, z, heading: Math.atan2(-z, -x) + (Math.random() - 0.5), hp: t.hp, maxHp: t.hp,
    tx: 0, tz: 0, pause: 0, kx: 0, kz: 0, lastHit: -1, walk: Math.random() * 10, dying: 0, ...mesh, hpBar: hp,
    life: 20 + Math.random() * 20, // au bout de ce temps, l'insecte s'en va
    hunger: hungry ? 3 * S.hungerMult : Infinity, // les affamés hésitent un peu, puis filent vers le goûter
    mode: 'wander', gone: false, sniff: Math.random(),
  };
  newTarget(bug);
  bugs.push(bug);
  return bug;
}
function newTarget(b) {
  b.tx = (Math.random() * 2 - 1) * (DESK_X - 0.06);
  b.tz = (Math.random() * 2 - 1) * (DESK_Z - 0.06);
}
function removeBug(i) {
  const b = bugs[i];
  scene.remove(b.group, b.hpBar.g);
  b.group.traverse(o => { if (o.isMesh) o.material.dispose(); });
  b.hpBar.fill.material.dispose();
  bugs.splice(i, 1);
}

let combo = 0, lastKillTime = -99, gameTime = 0;

function killBug(b) {
  const prevLevel = infestLevel();
  combo = gameTime - lastKillTime <= S.comboWindow ? combo + 1 : 1;
  lastKillTime = gameTime;
  state.bestCombo = Math.max(state.bestCombo, combo);
  const comboMult = Math.min(COMBO_CAP, 1 + (combo - 1) * S.comboBonus);
  const gain = b.t.reward * S.bounty * comboMult;
  state.money += gain;
  state.totalMoney += gain;
  state.kills++;
  state.run.kills++;
  state.run.money += gain;
  state.killsByType[b.t.id] = (state.killsByType[b.t.id] || 0) + 1;
  popup('+' + fmtMoney(gain), b.x, b.z);
  if (combo >= 3) popup('Combo ×' + combo, b.x, b.z - 0.05, 'crit');
  addSplat(b.x, b.z, b.t.r);
  b.dying = 0.001;
  b.hpBar.g.visible = false;
  const newLevel = infestLevel();
  if (newLevel > prevLevel) {
    banner(`Infestation niveau ${newLevel + 1} !`, `Nouveaux insectes : ${BUG_TYPES[newLevel].name}`);
    shopDirty = true;
  }
}

function baseDamage(ratio, impact) {
  // Une toupie encore debout fait toujours au moins ~1 de dégât (écrase un petit cafard)
  return 1.5 * Math.pow(S.mass / 20, 0.8) * S.blades * (0.6 + 0.4 * ratio) * Math.sqrt(S.rpm / 600) * (1 + 2 * impact);
}

function hitBug(top, b, now) {
  if (now - b.lastHit < 0.1 || b.dying) return;
  b.lastHit = now;
  const ratio = top.spin / top.launchSpin;
  let dmg = baseDamage(ratio, Math.hypot(top.vx, top.vz));
  if (Math.random() < S.crit) { dmg *= 3; popup('CRITIQUE', b.x, b.z - 0.03, 'crit'); }
  b.hp -= dmg;
  // La toupie perd de la rotation en percutant l'insecte
  top.spin -= 18 * b.t.mass / (S.mass / 20) * S.inertia;
  if (b.hp <= 0) killBug(b);
}

function shockwave(top) {
  const r = S.shockRadius;
  addShock(top.x, top.z, r);
  const dmg = 3 * baseDamage(0.5, 0);
  for (const b of bugs) {
    if (b.dying || b.gone) continue;
    if (Math.hypot(b.x - top.x, b.z - top.z) < r + b.t.r) {
      b.hp -= dmg;
      if (b.hp <= 0) killBug(b);
    }
  }
}

// Un insecte affamé atteint le goûter
function biteSnack(b) {
  state.run.snack -= b.t.bite;
  popup(`−${b.t.bite} 🍪`, PLATE.x, PLATE.z, 'bite');
  const hud = document.getElementById('hud');
  hud.classList.remove('hurt');
  void hud.offsetWidth;
  hud.classList.add('hurt');
  updateCookies();
  b.gone = true;
  if (state.run.snack <= 0) defeat();
}

// =====================================================================
//  PHYSIQUE
// =====================================================================
function stepTop(top, dt, now) {
  if (top.falling) return;
  const ratio = top.spin / top.launchSpin;

  // Dérive naturelle : la toupie « danse » sur le bureau en décrivant des courbes
  top.wanderRate = Math.max(-2.5, Math.min(2.5, top.wanderRate + (Math.random() - 0.5) * 10 * dt));
  top.wander += top.wanderRate * dt;
  let ax = Math.cos(top.wander) * S.drift * ratio;
  let az = Math.sin(top.wander) * S.drift * ratio;

  // Agressivité : attirée par l'insecte le plus proche
  if (S.chase > 0) {
    let best = null, bd = 0.5;
    for (const b of bugs) {
      if (b.dying || b.gone) continue;
      const d = Math.hypot(b.x - top.x, b.z - top.z);
      if (d < bd) { bd = d; best = b; }
    }
    if (best) {
      ax += ((best.x - top.x) / bd) * S.chase * ratio;
      az += ((best.z - top.z) / bd) * S.chase * ratio;
    }
  }
  top.vx += ax * dt;
  top.vz += az * dt;
  const fr = Math.exp(-S.linFric * dt);
  top.vx *= fr; top.vz *= fr;
  top.x += top.vx * dt;
  top.z += top.vz * dt;

  // Rebonds sur les bords du bureau
  const r = S.radius;
  if (top.x < -DESK_X + r) { top.x = -DESK_X + r; top.vx = Math.abs(top.vx) * S.restitution; top.spin *= 0.98; }
  if (top.x > DESK_X - r) { top.x = DESK_X - r; top.vx = -Math.abs(top.vx) * S.restitution; top.spin *= 0.98; }
  if (top.z < -DESK_Z + r) { top.z = -DESK_Z + r; top.vz = Math.abs(top.vz) * S.restitution; top.spin *= 0.98; }
  if (top.z > DESK_Z - r) { top.z = DESK_Z - r; top.vz = -Math.abs(top.vz) * S.restitution; top.spin *= 0.98; }

  // Rebonds sur le mug, le pot à crayons et l'assiette
  for (const o of OBSTACLES) {
    const dx = top.x - o.x, dz = top.z - o.z, d = Math.hypot(dx, dz), min = o.r + r;
    if (d < min && d > 0) {
      const nx = dx / d, nz = dz / d;
      top.x = o.x + nx * min; top.z = o.z + nz * min;
      const vn = top.vx * nx + top.vz * nz;
      if (vn < 0) { top.vx -= (1 + S.restitution) * vn * nx; top.vz -= (1 + S.restitution) * vn * nz; top.spin *= 0.97; }
    }
  }

  // Chocs avec les insectes
  for (const b of bugs) {
    if (b.dying || b.gone) continue;
    const br = b.t.r * 0.8;
    const dx = b.x - top.x, dz = b.z - top.z, d = Math.hypot(dx, dz), min = r + br;
    if (d < min && d > 0) {
      const nx = dx / d, nz = dz / d;
      const mt = S.mass, mb = b.t.mass;
      const overlap = min - d;
      top.x -= nx * overlap * (mb / (mt + mb));
      top.z -= nz * overlap * (mb / (mt + mb));
      b.x += nx * overlap * (mt / (mt + mb));
      b.z += nz * overlap * (mt / (mt + mb));
      const vrel = (b.kx - top.vx) * nx + (b.kz - top.vz) * nz;
      if (vrel < 0) {
        const j = -(1.6 * vrel) / (1 / mt + 1 / mb);
        top.vx -= (j / mt) * nx; top.vz -= (j / mt) * nz;
        b.kx += (j / mb) * nx; b.kz += (j / mb) * nz;
      }
      const fling = 0.25 * ratio * Math.min(1, mt / mb / 4);
      b.kx += -nz * fling; b.kz += nx * fling;
      hitBug(top, b, now);
    }
  }

  // Perte de rotation
  top.spin *= Math.exp(-S.decay * dt);
  if (top.spin < top.launchSpin * S.fallRatio || top.spin <= 0) {
    top.falling = 0.001;
    top.fallDir = top.prec;
    if (S.shockRadius > 0) shockwave(top);
  }
}

function stepTopsTogether() {
  // Chocs entre toupies (multi-lancer)
  for (let i = 0; i < tops.length; i++) {
    for (let j = i + 1; j < tops.length; j++) {
      const a = tops[i], b = tops[j];
      if (a.falling || b.falling) continue;
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), min = S.radius * 2;
      if (d < min && d > 0) {
        const nx = dx / d, nz = dz / d, o = (min - d) / 2;
        a.x -= nx * o; a.z -= nz * o; b.x += nx * o; b.z += nz * o;
        const vrel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
        if (vrel < 0) {
          const j2 = -vrel * 0.9;
          a.vx -= j2 * nx; a.vz -= j2 * nz; b.vx += j2 * nx; b.vz += j2 * nz;
        }
      }
    }
  }
}

function stepBug(b, dt) {
  if (b.dying || b.gone) return;
  const slow = onTrap(b.x, b.z) ? 0.25 : 1;

  // Les affamés partent manger le goûter ; les autres finissent par s'en aller
  if (b.mode === 'wander') {
    b.hunger -= dt;
    b.life -= dt;
    if (b.hunger <= 0) {
      b.pause = 0;
      b.mode = 'hungry';
      b.mat.emissive.setHex(0x8a1a00); // les affamés rougissent : à écraser en priorité !
      b.mat.emissiveIntensity = 0.7;
    } else if (b.life <= 0) {
      b.pause = 0;
      b.mode = 'leaving';
      const exits = [[-DESK_X - 0.08, b.z, DESK_X + b.x], [DESK_X + 0.08, b.z, DESK_X - b.x], [b.x, -DESK_Z - 0.08, DESK_Z + b.z]];
      exits.sort((a, c) => a[2] - c[2]);
      b.tx = exits[0][0];
      b.tz = exits[0][1];
    }
  }
  if (b.mode === 'leaving') {
    b.heading = Math.atan2(b.tz - b.z, b.tx - b.x);
    b.x += Math.cos(b.heading) * b.t.speed * 1.3 * slow * dt;
    b.z += Math.sin(b.heading) * b.t.speed * 1.3 * slow * dt;
    b.walk += dt * b.t.speed * 200;
    if (Math.abs(b.x) > DESK_X + 0.04 || b.z < -DESK_Z - 0.04) b.gone = true;
    return;
  }

  // Peur : certains insectes s'enfuient quand une toupie approche
  let fleeing = false, smelling = null;
  for (const top of tops) {
    if (top.falling) continue;
    const dx = b.x - top.x, dz = b.z - top.z, d = Math.hypot(dx, dz);
    // Odeur sucrée : certains insectes sont attirés (pas tous, et seulement de près)
    if (S.smellRadius > 0 && b.sniff < S.smellChance && d < S.smellRadius + S.radius) smelling = top;
    else if (b.t.fear > 0 && d < b.t.fear + S.radius) {
      b.tx = Math.max(-DESK_X, Math.min(DESK_X, b.x + (dx / d) * 0.3));
      b.tz = Math.max(-DESK_Z, Math.min(DESK_Z, b.z + (dz / d) * 0.3));
      fleeing = true;
      b.pause = 0;
    }
  }
  if (smelling) { b.tx = smelling.x; b.tz = smelling.z; b.pause = 0; }
  else if (b.mode === 'hungry' && !fleeing) { b.tx = PLATE.x; b.tz = PLATE.z; b.pause = 0; }

  let speed = 0;
  if (b.pause > 0) {
    b.pause -= dt;
  } else {
    const dx = b.tx - b.x, dz = b.tz - b.z, d = Math.hypot(dx, dz);
    if (d < 0.03 && b.mode === 'wander' && !smelling) {
      newTarget(b);
      if (Math.random() < 0.5) b.pause = 0.3 + Math.random() * 1.5; // les cafards s'arrêtent souvent
    }
    const want = Math.atan2(dz, dx);
    let diff = want - b.heading;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    b.heading += Math.max(-6 * dt, Math.min(6 * dt, diff));
    speed = b.t.speed * (fleeing ? 1.6 : b.mode === 'hungry' ? 1.2 : 1) * slow;
  }
  b.x += (Math.cos(b.heading) * speed + b.kx) * dt;
  b.z += (Math.sin(b.heading) * speed + b.kz) * dt;
  const kd = Math.exp(-6 * dt);
  b.kx *= kd; b.kz *= kd;
  const r = b.t.r;
  b.x = Math.max(-DESK_X + r, Math.min(DESK_X - r, b.x));
  b.z = Math.max(-DESK_Z + r, Math.min(DESK_Z - r, b.z));
  for (const o of OBSTACLES) {
    const dx = b.x - o.x, dz = b.z - o.z, d = Math.hypot(dx, dz), min = o.r + r;
    if (d < min && d > 0) {
      if (o.kind === 'plate' && b.mode === 'hungry') { biteSnack(b); return; }
      b.x = o.x + (dx / d) * min; b.z = o.z + (dz / d) * min;
      if (b.mode === 'wander') newTarget(b);
    }
  }
  b.walk += dt * (speed * 160 + (Math.hypot(b.kx, b.kz) > 0.05 ? 20 : 0));
}

let paused = false;
const modal = document.getElementById('modal'), modalBox = document.getElementById('modalBox');

function availablePerks() { return PERKS.filter(p => perkLevel(p.id) < p.max); }
function pickChoices() {
  const pool = availablePerks().slice();
  const out = [];
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id);
  return out;
}

function endWave() {
  const run = state.run;
  const reward = Math.round(0.5 * Math.pow(run.wave, 1.5) * S.bounty);
  state.money += reward;
  state.totalMoney += reward;
  run.money += reward;
  run.snack = Math.min(run.maxSnack, run.snack + 2);
  updateCookies();
  run.wave++;
  run.waveTime = 0;
  run.raidsSent = 0;
  if (run.wave > state.bestWave) { state.bestWave = run.wave; refreshStats(); }
  run.choice = pickChoices();
  save();
  showPerkChoice(reward);
}

function showPerkChoice(reward) {
  const run = state.run;
  if (!run.choice || !run.choice.length) { run.choice = null; return; }
  paused = true;
  charging = false;
  modalBox.className = 'modalBox';
  modalBox.replaceChildren();
  const h = document.createElement('h2');
  h.textContent = `Vague ${run.wave - 1} repoussée !`;
  const lead = document.createElement('p');
  lead.className = 'lead';
  lead.textContent = (reward ? `+${fmtMoney(reward)} · ` : '') + `+2 🍪 · Choisis un bonus pour cette partie (vague ${run.wave} ensuite)`;
  const grid = document.createElement('div');
  grid.className = 'perkChoices';
  for (const id of run.choice) {
    const p = PERKS.find(x => x.id === id);
    const n = perkLevel(id) + 1;
    const btn = document.createElement('button');
    btn.className = 'perk';
    btn.innerHTML = '<div class="ico"></div><div class="pname"></div><div class="pdesc"></div><div class="pstack"></div>';
    btn.querySelector('.ico').textContent = p.icon;
    btn.querySelector('.pname').textContent = p.name;
    btn.querySelector('.pdesc').textContent = p.desc(n);
    btn.querySelector('.pstack').textContent = p.max > 1 ? `Niveau ${n} / ${p.max}` : '';
    btn.onclick = () => takePerk(id);
    grid.appendChild(btn);
  }
  modalBox.append(h, lead, grid);
  modal.classList.add('open');
}

function takePerk(id) {
  const run = state.run;
  run.perks[id] = perkLevel(id) + 1;
  if (id === 'cookies') { run.maxSnack += 4; run.snack = Math.min(run.maxSnack, run.snack + 6); updateCookies(); }
  if (id === 'glu') addTrap();
  run.choice = null;
  refreshStats();
  save();
  modal.classList.remove('open');
  paused = false;
  const p = PERKS.find(x => x.id === id);
  banner(`${p.icon} ${p.name}`, `Vague ${run.wave} : ça repart !`);
  shopDirty = true;
}

function defeat() {
  const run = state.run;
  if (run.over) return;
  run.over = true;
  paused = true;
  charging = false;
  state.bestWave = Math.max(state.bestWave, run.wave);

function restartRun() {
  state.runs++;

  tops.length = 0;

  spawnTimer = 0;
  rebuildTraps();
  updateCookies();
  refreshStats();
  save();

}

const raycaster = new THREE.Raycaster();
const deskPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pointerNdc = new THREE.Vector2();
const aimPoint = new THREE.Vector2(0, -0.2);
let charging = false, chargeT = 0, cooldown = 0, launcherKick = 0, lastInput = 0;

function pointerToDesk(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNdc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointerNdc, camera);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(deskPlane, hit)) return;
  aimPoint.set(Math.max(-DESK_X, Math.min(DESK_X, hit.x)), Math.max(-DESK_Z, Math.min(LAUNCH.y - 0.06, hit.z)));
}
function isReady() { return tops.length === 0 && cooldown <= 0 && !paused; }
function gaugeValue() { return 0.5 - 0.5 * Math.cos((chargeT / 1.2) * Math.PI * 2); }

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  lastInput = gameTime;
  pointerToDesk(e);
  if (!isReady()) return;
  charging = true;
  chargeT = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* capture impossible : sans gravité */ }
});
canvas.addEventListener('pointermove', e => { pointerToDesk(e); });
function release() {
  if (!charging) return;
  charging = false;
  const g = gaugeValue();
  const perfect = g >= 1 - S.perfect;
  if (perfect) popup('PARFAIT !', LAUNCH.x, LAUNCH.y - 0.08, 'big');
  launchTops(aimPoint, g, perfect);
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => { charging = false; });

// =====================================================================
//  BOUCLE DE JEU
// =====================================================================
let last = performance.now(), hudTimer = 0, saveTimer = 0;
const camQuat = new THREE.Quaternion();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);
  else { hudTimer -= dt; if (hudTimer <= 0) { hudTimer = 0.2; updateHud(); } if (shopDirty) renderShop(); }
  renderer.render(scene, camera);
}

function update(dt) {
  gameTime += dt;
  const run = state.run;

  // Vagues
  run.waveTime += dt;
  if (run.waveTime >= WAVE_LEN) { endWave(); return; }

  // Raids : les affamés arrivent à intervalles réguliers pendant la vague
  const raiders = waveRaiders();
  if (run.raidsSent < raiders && run.waveTime >= (WAVE_LEN * (run.raidsSent + 0.5)) / (raiders + 0.5)) {
    run.raidsSent++;
    spawnBug(true);
  }

  // Apparition des insectes
  spawnTimer += dt * S.spawnRate * waveSpawnMult();
  while (spawnTimer >= 1) {
    spawnTimer -= 1;
    if (bugs.filter(b => !b.dying && b.mode !== 'leaving' && !b.gone).length < bugCap()) spawnBug();
  }

  // Physique en petits pas pour éviter que la toupie traverse les insectes
  const steps = Math.ceil(dt / 0.008);
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    for (const top of tops) stepTop(top, h, gameTime);
    stepTopsTogether();
    for (const b of bugs) stepBug(b, h);
    if (paused) break; // défaite pendant ce pas
  }

  // Animation des toupies
  for (const top of tops) {
    const ratio = Math.max(0, top.spin / top.launchSpin);
    const r = S.radius;
    top.tilt.position.set(top.x, 0, top.z);
    top.tilt.scale.set(r, r * 0.95, r);
    if (!top.falling) {
      top.angle += (6 + 40 * ratio) * dt;
      top.prec += (5 + 8 * ratio) * dt;
      const wob = Math.max(0, (0.65 - ratio) / 0.65) * 0.32 + 0.02;
      top.tilt.rotation.set(Math.cos(top.prec) * wob, 0, Math.sin(top.prec) * wob);
    } else {
      top.falling += dt;
      const f = Math.min(1, top.falling / 0.35);
      const lean = 0.34 + f * 1.05;
      top.tilt.rotation.set(Math.cos(top.fallDir) * lean, 0, Math.sin(top.fallDir) * lean);
      top.angle += (1 - f) * 6 * dt;
      if (top.falling > 1.4) top.tilt.position.y = -(top.falling - 1.4) * 0.08;
      if (top.falling > 1.9) top.dead = true;
    }
    top.spinner.rotation.y = top.angle;
    top.gyro.rotation.y = -top.angle * 0.15;
    if (top.flame) top.flame.scale.set(1, 0.8 + Math.random() * 0.5, 1);
    if (top.aura) { top.aura.rotation.z += dt * 3; top.aura.material.opacity = 0.35 + 0.25 * Math.sin(gameTime * 8); }
    if (top.smell) {
      top.smell.visible = !top.falling;
      top.smell.position.set(top.x, 0.003, top.z);
      const sr = S.smellRadius + S.radius;
      top.smell.scale.setScalar(sr * (0.95 + 0.05 * Math.sin(gameTime * 4)));
    }
    if (top.trail) {
      const p = top.trail.geometry.attributes.position;
      if (!top.trailInit) { for (let i = 0; i < p.count; i++) p.setXYZ(i, top.x, 0.01, top.z); top.trailInit = true; }
      for (let i = p.count - 1; i > 0; i--) p.setXYZ(i, p.getX(i - 1), p.getY(i - 1), p.getZ(i - 1));
      p.setXYZ(0, top.x, 0.01, top.z);
      p.needsUpdate = true;
      top.trail.visible = !top.falling;
    }
  }
  for (let i = tops.length - 1; i >= 0; i--) {
    if (tops[i].dead) {
      disposeTop(tops[i]);
      tops.splice(i, 1);
      if (tops.length === 0) cooldown = S.cooldown;
    }
  }
  if (tops.length === 0 && cooldown > 0) cooldown -= dt;

  // Lanceur automatique (vise en priorité les affamés)
  if (S.auto && isReady() && !charging && gameTime - lastInput > 1.5) {
    const alive = bugs.filter(b => !b.dying && !b.gone);
    const target = alive.find(b => b.mode === 'hungry') || alive[0];
    const aim = target ? new THREE.Vector2(target.x, target.z) : new THREE.Vector2((Math.random() - 0.5) * 0.8, -0.2);
    launchTops(aim, 0.85, false);
  }

  // Charge du lanceur
  if (charging) chargeT += dt;
  $('gaugeFill').style.height = (charging ? gaugeValue() : 0) * 100 + '%';
  launcherKick = Math.max(0, launcherKick - dt * 4);
  lBody.position.z = -launcherKick * 0.02;
  lRing.rotation.z += (charging ? 25 : 2) * dt;

  // Ligne de visée
  aimLine.visible = isReady();
  if (aimLine.visible) {
    const p = aimGeo.attributes.position;
    p.setXYZ(0, LAUNCH.x, 0.003, LAUNCH.y);
    p.setXYZ(1, aimPoint.x, 0.003, aimPoint.y);
    p.needsUpdate = true;
  }

  // Animation des insectes
  camera.getWorldQuaternion(camQuat);
  for (let i = bugs.length - 1; i >= 0; i--) {
    const b = bugs[i];
    if (b.gone) { removeBug(i); continue; }
    b.group.position.set(b.x, 0, b.z);
    b.group.rotation.y = -b.heading;
    b.legs.forEach((leg, k) => { leg.rotation.y = Math.sin(b.walk + k * Math.PI * 0.5 + (k % 2) * Math.PI) * 0.45; });
    if (b.maxHp > 1 && b.hp < b.maxHp && !b.dying) {
      const w = Math.max(0.05, b.t.r * 2.2);
      b.hpBar.g.visible = true;
      b.hpBar.g.position.set(b.x, b.t.r * 0.9 + 0.02, b.z);
      b.hpBar.g.quaternion.copy(camQuat);
      b.hpBar.g.scale.set(w, 0.008, 1);
      const f = Math.max(0, b.hp / b.maxHp);
      b.hpBar.fill.scale.x = f;
      b.hpBar.fill.position.x = -(1 - f) / 2;
    }
    if (b.dying) {
      b.dying += dt;
      const s = b.t.r * BUG_VISUAL;
      b.group.scale.set(s * (1 + b.dying), s * Math.max(0.1, 1 - b.dying * 4), s * (1 + b.dying));
      if (b.dying > 0.3) removeBug(i);
    }
  }

  // Taches et ondes de choc qui s'effacent
  for (let i = splats.length - 1; i >= 0; i--) {
    const s = splats[i];
    s.life -= dt;
    s.m.material.opacity = Math.min(0.55, s.life / 2);
    if (s.life <= 0) { scene.remove(s.m); s.m.material.dispose(); splats.splice(i, 1); }
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i];
    s.t += dt;
    s.m.scale.setScalar(s.r * Math.min(1, s.t / 0.25));
    s.m.material.opacity = Math.max(0, 0.9 - s.t * 2);
    if (s.t > 0.5) { scene.remove(s.m); s.m.material.dispose(); shocks.splice(i, 1); }
  }

  // Interface (pas à chaque image, pour économiser la batterie)
  hudTimer -= dt;
  if (shopDirty) renderShop();
  if (hudTimer <= 0) { hudTimer = 0.15; updateHud(); }
  saveTimer -= dt;
  if (saveTimer <= 0) { saveTimer = 5; save(); }
}

window.addEventListener('resize', placeCamera);
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
placeCamera();
updateLauncherSkin();
rebuildTraps();
updateCookies();
updateHud();
// Reprise d'une partie interrompue pendant un choix de bonus ou une défaite
if (state.run.over) { state.run.over = false; defeat(); }
else if (state.run.choice) showPerkChoice(0);
requestAnimationFrame(frame);

// Accès pour les tests (lecture des stats et avance du temps)
window.__dbg = {
  state, get S() { return S; }, tops, bugs, update, launchTops, spawnBug, UPGRADES, PERKS, buy, costOf, infestLevel,
  refreshStats, camera, THREE, takePerk, restartRun, get paused() { return paused; }, endWave, makeTopMesh, scene, defeat,
};
</script>
</body>
